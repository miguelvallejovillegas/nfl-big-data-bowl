[project]
name = "bdb2027"
version = "0.1.0"
description = "NFL Big Data Bowl 2027 — Combine tracking to NFL performance"
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "nflreadpy>=0.1",
    "supabase>=2.10",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdb27"]

[tool.ruff]
line-length = 100
target-version = "py311"
